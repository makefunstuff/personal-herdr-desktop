<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Workbench theme: dot-matrix symbols for the Omarchy shell (bar, panels, menus) only. "Workbench Glyphs" holds just
     the bar's Nerd Font symbol codepoints; letters still come from JetBrains Mono. Scoped to the quickshell process,
     so terminals and other apps are untouched. Installed/removed by the omarchy theme-set hook. -->
<fontconfig>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>quickshell</string></test>
    <test name="family" qual="any"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Workbench Glyphs</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>quickshell</string></test>
    <test name="family" qual="any"><string>omarchy</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Workbench Glyphs</string></edit>
  </match>
</fontconfig>
