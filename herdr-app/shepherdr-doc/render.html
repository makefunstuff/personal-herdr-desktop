<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>herdr.doc</title>
<style>
/* Stock renderer for herdr.doc/1 artifacts (see SPEC.md). Sealed: no network; draws window.shepherdr.data. */
:root{--ok:var(--ready,#3fa36b);--warn:var(--work,#d89a1b);--bad:var(--need,#d9534f);--info:var(--accent,#4a7bd0)}
body{font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg,#ddd);margin:0}
#doc{display:flex;flex-direction:column;gap:12px}
.head{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--line,#444);padding-bottom:8px}
.head h1{font-size:15px;margin:0;flex:1;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--fg2,#aaa);font-size:12px}
.badge{font-size:11px;font-weight:700;padding:1px 6px;color:var(--bg,#000)}
.ready,.ok,.done{background:var(--ok)}.work,.warn{background:var(--warn)}.need,.bad,.fail{background:var(--bad)}.info{background:var(--info)}
h2{font-size:12px;margin:6px 0 0;color:var(--fg2,#aaa);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line,#444)}
p{margin:0;white-space:pre-wrap}
.stats{display:flex;flex-wrap:wrap;gap:8px}.stat{border:1px solid var(--line,#444);padding:6px 10px;min-width:90px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--fg2,#aaa);text-transform:uppercase}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}.stat.info b{color:var(--info)}
.stat.ok,.stat.warn,.stat.bad,.stat.info{background:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px}.kv dt{color:var(--fg2,#aaa)}.kv dd{margin:0}
ul,ol{margin:0;padding-left:20px}
.row{display:flex;gap:8px;align-items:baseline}.mark{width:16px;flex:none;font-weight:700}
.m-ok{color:var(--ok)}.m-bad{color:var(--bad)}.m-none{color:var(--fg3,#777)}.m-now{color:var(--warn)}
.note{color:var(--fg2,#aaa);font-size:12px}
table{border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line,#444);padding:3px 10px 3px 0;text-align:left}th{color:var(--fg2,#aaa);font-weight:600}
.bar{display:grid;grid-template-columns:minmax(80px,max-content) 1fr max-content;gap:8px;align-items:center;font-size:13px}
.track{height:10px;background:var(--well,#222)}.fill{height:10px;background:var(--info)}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
pre{margin:0;padding:8px;background:var(--well,#111);overflow:auto;font-size:12px;border-left:2px solid var(--line,#444)}
.add{color:var(--ok)}.del{color:var(--bad)}.hunk{color:var(--info)}
.callout{padding:8px 10px;border-left:3px solid var(--info);background:var(--well,#111)}
.callout.ok{border-color:var(--ok)}.callout.warn{border-color:var(--warn)}.callout.bad{border-color:var(--bad)}
.callout.ok,.callout.warn,.callout.bad,.callout.info{background:var(--well,#111)}
hr{border:0;border-top:1px solid var(--line,#444);margin:0}
a{color:var(--accent,#4a7bd0)}
</style></head><body><div id="doc"></div>
<script>
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=String(x);return e};
const S=v=>v==null?"":String(v);
const BLOCKS={
 heading:b=>E("h2",null,b.text),
 text:b=>E("p",null,b.text),
 divider:()=>E("hr"),
 stats:b=>{const w=E("div","stats");(b.items||[]).forEach(i=>{const s=E("div","stat "+S(i.tone));s.append(E("b",null,i.value),E("span",null,i.label));if(i.note)s.append(E("div","note",i.note));w.append(s)});return w},
 kv:b=>{const d=E("dl","kv");(b.items||[]).forEach(([k,v])=>d.append(E("dt",null,k),E("dd",null,v)));return d},
 list:b=>{const l=E(b.style==="number"?"ol":"ul");(b.items||[]).forEach(i=>l.append(E("li",null,i)));return l},
 checks:b=>{const w=E("div");(b.items||[]).forEach(i=>{const r=E("div","row");const m=i.ok===true?["✓","m-ok"]:i.ok===false?["✗","m-bad"]:["–","m-none"];r.append(E("span","mark "+m[1],m[0]),E("span",null,i.text));if(i.note)r.append(E("span","note",i.note));w.append(r)});return w},
 steps:b=>{const w=E("div");(b.items||[]).forEach((i,n)=>{const r=E("div","row");const m={done:["✓","m-ok"],now:["▶","m-now"],skip:["–","m-none"]}[i.state]||[String(n+1),"m-none"];r.append(E("span","mark "+m[1],m[0]),E("span",null,i.text));w.append(r)});return w},
 table:b=>{const t=E("table");const h=E("tr");(b.columns||[]).forEach(c=>h.append(E("th",null,c)));t.append(h);(b.rows||[]).slice(0,200).forEach(r=>{const tr=E("tr");r.forEach((c,i)=>{const td=E("td",null,c);if((b.align||[])[i]==="right")td.style.textAlign="right";tr.append(td)});t.append(tr)});return t},
 bars:b=>{const w=E("div");const max=b.max||Math.max(1,...(b.items||[]).map(i=>+i.value||0));(b.items||[]).forEach(i=>{const r=E("div","bar");const tr=E("div","track");const f=E("div","fill "+S(i.tone));f.style.width=Math.max(0,Math.min(100,(+i.value||0)/max*100))+"%";tr.append(f);r.append(E("span",null,i.label),tr,E("span","note",S(i.value)+(b.unit?" "+b.unit:"")));w.append(r)});return w},
 progress:b=>BLOCKS.bars({items:[{label:b.label,value:b.value,tone:b.tone}],max:b.max}),
 code:b=>{const w=E("div");if(b.file)w.append(E("div","note",b.file));w.append(E("pre",null,b.text));return w},
 diff:b=>{const w=E("div");if(b.file)w.append(E("div","note",b.file));const p=E("pre");S(b.text).split("\n").forEach(l=>{const s=E("div",l.startsWith("+")?"add":l.startsWith("-")?"del":l.startsWith("@@")?"hunk":null,l||" ");p.append(s)});w.append(p);return w},
 callout:b=>E("div","callout "+S(b.tone||"info"),b.text),
 links:b=>{const w=E("div");(b.items||[]).forEach(i=>{const a=E("a",null,i.label||i.url);a.href=i.url;a.target="_blank";w.append(E("div").appendChild(a).parentNode)});return w},
};
function draw(d){const root=document.getElementById("doc");root.textContent="";
 if(!d||d.format!=="herdr.doc/1"){root.append(E("p",null,"No herdr.doc/1 data."));return}
 const h=E("div","head");h.append(E("h1",null,d.title||"Untitled"));if(d.status)h.append(E("span","badge "+d.status,d.status.toUpperCase()));root.append(h);
 if(d.subtitle)root.append(E("div","sub",d.subtitle));
 (d.blocks||[]).forEach(b=>{const f=BLOCKS[b&&b.type];if(f)try{root.append(f(b))}catch(e){}});}
draw(window.shepherdr&&window.shepherdr.data);
document.addEventListener("shepherdr:data",e=>draw(e.detail));
</script></body></html>
